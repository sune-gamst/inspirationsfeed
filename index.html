<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspirationsfeed</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspiration">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E7E8;--ink:#181B1F;--mute:#646B71;--line:#C6CBCE;--panel:#F3F4F5;--good:#1D6B47;--bad:#A3312A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171A;--ink:#E7E9EB;--mute:#8C9399;--line:#2D3236;--panel:#1C2024;--good:#4DB384;--bad:#E26A60}}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Instrument Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto;padding:12px 16px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meta{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px}
.link{border:0;background:none;color:var(--ink);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:14px 0 10px}
.card{position:relative;width:min(100%, calc((100dvh - 270px) * .8));touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.card.fly{transition:transform .14s ease-in,opacity .14s ease-in}
.card.back{transition:transform .2s ease-out}
.card.enter{animation:enter .14s ease-out}
@keyframes enter{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.frame{aspect-ratio:4/5;width:100%;border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.45)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.stamp{position:absolute;top:14px;padding:4px 12px;border:2px solid;border-radius:4px;font-weight:600;font-size:18px;opacity:0;pointer-events:none;background:var(--bg)}
.stamp.yes{left:14px;color:var(--good)}.stamp.no{right:14px;color:var(--bad)}
.info{margin-top:10px;text-align:center;max-width:44ch}
.info b{font-weight:600}
.tags{font-size:12.5px;color:var(--mute);min-height:1.4em}
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.vote{height:56px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:17px;font-weight:600;cursor:pointer}
.vote.no{color:var(--bad)}.vote.yes{color:var(--good)}
.undo{border:0;background:none;color:var(--mute);font-size:13px;cursor:pointer;padding:8px}
.undo:disabled{opacity:.35;cursor:default}
.hint{grid-column:1/-1;text-align:center;font-size:12px;color:var(--mute)}
@media (hover:none){.hint{display:none}}
.empty{text-align:center;max-width:36ch;color:var(--mute)}
.sheet,.pv{position:fixed;inset:0;background:var(--bg);display:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet{overflow-y:auto}.sheet.open{display:block}
.pv{flex-direction:column;gap:12px}.pv.open{display:flex}
.in{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;width:100%;margin:0 auto}
.sheet h2{font-size:22px;font-weight:600;margin:6px 0 4px}
.sum{color:var(--mute);margin:0 0 20px;max-width:52ch}
.axis{margin:0 0 22px}
.axis h3{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.axis h3 span{font-weight:400;color:var(--mute);font-size:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:13.5px;padding:3px 0}
.track{position:relative;height:8px;background:var(--panel);border-radius:2px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:2px}
.num{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.pv-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pv-img img{max-width:min(100%,900px);max-height:100%;border-radius:6px;object-fit:contain}
.pv footer{max-width:560px;width:100%;margin:0 auto}
a.link{display:inline-block}
.likes a{display:block;color:var(--ink);padding:5px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:13.5px}
.likes a span{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.card.enter{animation:none}.card.fly,.card.back{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="seg" role="group" aria-label="Kunde">
      <button data-c="albatros" aria-pressed="true">Albatros</button>
      <button data-c="lokalbolig" aria-pressed="false">LokalBolig</button>
    </div>
    <div class="meta"><span id="count"></span><button class="link" id="openProfile">Profil</button></div>
  </header>
  <main class="stage" id="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Vis designet stort">
      <div class="frame" id="frame"></div>
      <div class="stamp yes">Ja</div><div class="stamp no">Nej</div>
    </div>
    <div class="info"><b id="title"></b> <span class="tags" id="credit"></span><div class="tags" id="tags"></div></div>
  </main>
  <footer>
    <button class="vote no" id="no">Nej</button>
    <button class="undo" id="undo" disabled>Fortryd</button>
    <button class="vote yes" id="yes">Ja</button>
    <div class="hint">← nej, → ja, Enter for stort billede, Z fortryd</div>
  </footer>
</div>

<div class="pv" id="pv" role="dialog" aria-label="Forhåndsvisning">
  <div class="top"><a class="link" id="pvLink" target="_blank" rel="noopener">Åbn kilden</a><button class="link" id="pvClose">Luk</button></div>
  <div class="pv-img"><img id="pvImg" alt=""></div>
  <footer><button class="vote no" id="pvNo">Nej</button><span></span><button class="vote yes" id="pvYes">Ja</button></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Profil">
  <div class="in">
    <div class="top"><span class="meta" id="src"></span><button class="link" id="closeProfile">Luk</button></div>
    <h2 id="pTitle"></h2><p class="sum" id="pSum"></p><div id="pAxes"></div>
    <section class="axis"><h3>Dine Ja'er</h3><div id="pLikes" class="likes"></div></section>
    <button class="link" id="reset" style="color:var(--bad)">Nulstil profilen for denne kunde</button>
  </div>
</div>

<script>
const AX={brand:{label:'Brand-udtryk',tags:{typo:'Udtryksfuld typografi',farve:'Stærk farveidentitet',illu:'Illustration og grafik',motion:'Bevægelse',redak:'Redaktionelt'}},
  layout:{label:'Layout-type',tags:{full:'Fuldt billede',split:'Split',grid:'Grid',kort:'Kort',utrad:'Utraditionelt layout'}},
  branche:{label:'Branche',tags:{rejser:'Rejser og hoteller',bolig:'Bolig, arkitektur og interiør'}},
  farve:{label:'Farvestemning',tags:{varm:'Varm',kolig:'Kølig',jord:'Jordfarver',mono:'Monokrom',neon:'Mættet',pastel:'Pastel',dyb:'Dyb og mørk'}},
  stemning:{label:'Stemning',tags:{luksus:'Luksuriøs',legende:'Legende',minimal:'Minimalistisk',raa:'Rå',rolig:'Rolig'}},
  emne:{label:'Emne',tags:{}}};
let ITEMS=[],BYID={},UPDATED='';
const CLIENTS={albatros:'Albatros',lokalbolig:'LokalBolig'};
const keys=a=>Object.keys(AX[a].tags);
const label=t=>{const[a,k]=t.split(':');return (AX[a]&&AX[a].tags[k])||k.replace(/-/g,' ')};
const axisOf=t=>t.split(':')[0];

/* State */
const blank=()=>({w:{},h:[],n:0});
let store={albatros:blank(),lokalbolig:blank()},client='albatros';
try{const s=JSON.parse(localStorage.getItem('insp-feed')||'null');if(s)for(const c in CLIENTS)if(s[c])store[c]=s[c]}catch(e){}
const save=()=>{try{localStorage.setItem('insp-feed',JSON.stringify(store))}catch(e){}};

/* Algoritme: vægt per tag + automatisk vægt per akse ud fra hvor samlede Ja'erne er */
function importance(){
  const st=store[client],imp={};
  for(const a in AX){
    const ks=keys(a),pos=ks.map(k=>Math.max(0,st.w[a+':'+k]||0)),sum=pos.reduce((s,v)=>s+v,0);
    if(sum<3||ks.length<2){imp[a]=a==='brand'?1:.6;continue}
    const p=pos.map(v=>v/sum),ent=-p.reduce((s,v)=>s+(v>0?v*Math.log(v):0),0),conc=1-ent/Math.log(ks.length);
    imp[a]=(a==='brand'?1:.5)+conc*1.5;
  }
  if(imp.emne)imp.emne*=.5;
  return imp;
}
function score(it,imp){
  const w=store[client].w,by={};
  for(const t of it.tags){const a=axisOf(t);(by[a]=by[a]||[]).push(w[t]||0)}
  let s=0;for(const a in by)s+=by[a].reduce((x,y)=>x+y,0)/by[a].length*imp[a];
  return s;
}
const unseen=()=>{const seen=new Set(store[client].h.map(h=>h.id));return ITEMS.filter(i=>!seen.has(i.id))};
function ranked(){const imp=importance();return unseen().map(i=>[i,score(i,imp)+Math.random()*.8]).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function pickNext(){
  const pool=ranked();if(!pool.length)return null;
  const eps=Math.max(.12,.6-store[client].n*.012);
  return Math.random()<eps?pool[Math.floor(Math.random()*pool.length)]:pool[0];
}
function preload(){ranked().slice(0,3).forEach(i=>{const im=new Image();im.src=i.sq||i.img})}

/* UI */
const $=id=>document.getElementById(id);
const card=$('card'),frame=$('frame'),sY=card.querySelector('.yes'),sN=card.querySelector('.no');
let current=null,busy=false;
function show(it){
  current=it;
  if(!it){
    card.style.display='none';
    $('title').textContent='';$('credit').textContent='';
    $('tags').innerHTML=`<div class="empty">Du har vurderet alle ${ITEMS.length} sites for ${CLIENTS[client]}. Nye kommer hver morgen.</div>`;
    return;
  }
  card.style.display='';
  frame.innerHTML=`<img src="${it.sq||it.img}" alt="Screenshot af ${it.title}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'Billedet kunne ikke hentes',style:'padding:24px;color:var(--mute)'}))">`;
  $('title').textContent=it.title;
  $('credit').textContent=it.credit?`af ${it.credit}`:'';
  $('tags').textContent=it.tags.map(label).join(', ');
  card.style.transform='';card.style.opacity='';sY.style.opacity=0;sN.style.opacity=0;card.className='card enter';
  preload();
}
function meta(){const st=store[client];$('count').textContent=`${st.n} af ${ITEMS.length}`;$('undo').disabled=!st.h.length}
function vote(good){
  if(busy||!current)return;busy=true;
  const st=store[client],d=good?1:-1;
  for(const t of current.tags)st.w[t]=(st.w[t]||0)+d;
  st.n++;st.h.push({id:current.id,v:d});save();meta();
  card.className='card fly';card.style.transform=`translateX(${good?130:-130}%) rotate(${good?14:-14}deg)`;card.style.opacity=0;
  setTimeout(()=>{busy=false;show(pickNext())},matchMedia('(prefers-reduced-motion: reduce)').matches?0:140);
}
function undo(){
  const st=store[client];if(!st.h.length||busy)return;
  const last=st.h.pop(),it=BYID[last.id];
  for(const t of it.tags)st.w[t]=(st.w[t]||0)-last.v;
  st.n--;save();meta();show(it);
}
let sx=0,dx=0,drag=false;
card.addEventListener('pointerdown',e=>{if(busy)return;drag=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.className='card'});
card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;sY.style.opacity=Math.max(0,Math.min(1,dx/90));sN.style.opacity=Math.max(0,Math.min(1,-dx/90))});
function end(){
  if(!drag)return;drag=false;
  if(Math.abs(dx)<6){card.style.transform='';openPv();return}
  if(Math.abs(dx)>90)vote(dx>0);else{card.className='card back';card.style.transform='';sY.style.opacity=0;sN.style.opacity=0}
}
card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPv()}});
function openPv(){if(!current)return;$('pvImg').src=current.img;$('pvImg').alt=`Screenshot af ${current.title}`;$('pvLink').href=current.url;$('pv').classList.add('open');$('pvClose').focus()}
function closePv(){$('pv').classList.remove('open');card.focus()}
$('pvClose').onclick=closePv;$('pvYes').onclick=()=>{closePv();vote(true)};$('pvNo').onclick=()=>{closePv();vote(false)};
$('yes').onclick=()=>vote(true);$('no').onclick=()=>vote(false);$('undo').onclick=undo;
document.addEventListener('keydown',e=>{
  if($('sheet').classList.contains('open')){if(e.key==='Escape')closeP();return}
  if($('pv').classList.contains('open')){
    if(e.key==='Escape')closePv();else if(e.key==='ArrowRight'){closePv();vote(true)}else if(e.key==='ArrowLeft'){closePv();vote(false)}
    return;
  }
  if(e.key==='ArrowRight')vote(true);else if(e.key==='ArrowLeft')vote(false);else if(e.key.toLowerCase()==='z')undo();
});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  client=b.dataset.c;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));meta();show(pickNext());
});

/* Profil */
function renderProfile(){
  const st=store[client],imp=importance(),mx=Math.max(...Object.values(imp)),top=[];
  $('pTitle').textContent=`Profil for ${CLIENTS[client]}`;
  let html='';
  for(const a of Object.keys(AX).sort((x,y)=>imp[y]-imp[x])){
    let ks=keys(a).map(k=>[k,st.w[a+':'+k]||0]).sort((x,y)=>y[1]-x[1]);
    if(a==='emne')ks=ks.filter(x=>x[1]!==0).slice(0,10);
    if(!ks.length)continue;
    const max=Math.max(1,...ks.map(x=>Math.abs(x[1])));
    if(ks[0][1]>0)top.push(AX[a].tags[ks[0][0]].toLowerCase());
    const b=Math.max(1,Math.round(imp[a]/mx*5));
    html+=`<section class="axis"><h3>${AX[a].label}<span>styrer valg ${'●'.repeat(b)}<span style="opacity:.25">${'●'.repeat(5-b)}</span></span></h3>${ks.map(([k,v])=>{
      const w=Math.abs(v)/max*50,pos=v>=0?`left:50%;width:${w}%;background:var(--good)`:`right:50%;width:${w}%;background:var(--bad)`;
      return `<div class="row"><span>${AX[a].tags[k]}</span><div class="track"><div class="fill" style="${pos}"></div></div><span class="num">${v>0?'+':''}${v}</span></div>`}).join('')}</section>`;
  }
  $('pSum').textContent=st.n<10?`${st.n} vurderinger indtil videre. Profilen bliver tydelig efter 20 til 30.`:`Efter ${st.n} vurderinger trækker feedet mod: ${top.join(', ')||'endnu ingen klar retning'}.`;
  $('pAxes').innerHTML=html;
  const likes=st.h.filter(h=>h.v>0&&BYID[h.id]).slice(-40).reverse();
  $('pLikes').innerHTML=likes.length?likes.map(h=>{const i=BYID[h.id];return `<a href="${i.url}" target="_blank" rel="noopener">${i.title} <span>${i.credit||''}</span></a>`}).join(''):'<span class="tags">Ingen endnu.</span>';
  $('src').textContent=`${ITEMS.length} sites, opdateret ${UPDATED}`;
}
function closeP(){$('sheet').classList.remove('open')}
$('openProfile').onclick=()=>{renderProfile();$('sheet').classList.add('open')};
$('closeProfile').onclick=closeP;
$('reset').onclick=()=>{if(confirm(`Nulstil alle vurderinger for ${CLIENTS[client]}?`)){store[client]=blank();save();meta();renderProfile();show(pickNext())}};
(async()=>{
  try{
    const r=await fetch('feed.json?v='+Date.now());
    const d=await r.json();
    ITEMS=d.items.filter(i=>i.img);
    BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
    for(const i of ITEMS)for(const t of i.tags){const[a,k]=t.split(':');if(a==='emne')AX.emne.tags[k]=k.replace(/-/g,' ')}
    UPDATED=new Date(d.updated).toLocaleDateString('da-DK',{day:'numeric',month:'long'});
    meta();show(pickNext());
  }catch(e){
    $('tags').innerHTML='<div class="empty">Kunne ikke hente feed.json. Siden skal åbnes via sit link, ikke som lokal fil.</div>';
  }
})();
</script>
</body>
</html>
